<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesseract // 3D Secure Node</title>
    <style>
        :root {
            --bg-base: #030303;
            --surface: rgba(15, 15, 15, 0.8);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --rose: #8b0000;
            --rose-glow: rgba(139, 0, 0, 0.8);
            --text-main: #eaeaea;
            --text-muted: #555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-main);
            /* Gives the 3D depth to the page */
            perspective: 1000px; 
            background: radial-gradient(circle at center, #111 0%, var(--bg-base) 100%);
        }

        .header-text {
            position: absolute;
            top: 40px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 0.9rem;
            z-index: 10;
        }

        /* --- 3D Scene Setup --- */
        .scene {
            width: 200px;
            height: 200px;
            position: relative;
            /* Allows child elements to exist in 3D space */
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
        }

        /* The Cube */
        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Spinning animation for unlock */
        .cube.unlocking {
            transform: rotateY(720deg) rotateX(360deg) !important;
        }

        /* Floating animation */
        .scene-wrapper {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- Cube Faces --- */
        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--surface);
            border: 2px solid var(--rose);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 15px var(--rose-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: all 0.5s ease;
            overflow: hidden;
        }

        /* Positioning the 6 faces in 3D space (Radius is 100px, half of 200px width) */
        .front  { transform: rotateY(  0deg) translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY( 90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX( 90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        /* Face Content Styling */
        .face-title {
            color: var(--rose);
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .face-data {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .hex-stream {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* --- Unlocked State --- */
        .cube.unlocked .face {
            border-color: var(--gold);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 20px var(--gold-glow);
            background: rgba(212, 175, 55, 0.05);
        }

        .cube.unlocked .face-title {
            color: var(--gold);
        }
        
        .cube.unlocked .face-data {
            color: var(--gold);
        }

        /* Floor Grid for depth */
        .floor {
            position: absolute;
            bottom: -50px;
            width: 600px;
            height: 600px;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 39px, rgba(139, 0, 0, 0.2) 40px
            ),
            repeating-linear-gradient(
                90deg, transparent, transparent 39px, rgba(139, 0, 0, 0.2) 40px
            );
            transform: rotateX(75deg);
            z-index: -1;
            box-shadow: inset 0 0 100px var(--bg-base);
            pointer-events: none;
            transition: all 0.5s ease;
        }

        body.unlocked .floor {
            background: repeating-linear-gradient(
                0deg, transparent, transparent 39px, rgba(212, 175, 55, 0.1) 40px
            ),
            repeating-linear-gradient(
                90deg, transparent, transparent 39px, rgba(212, 175, 55, 0.1) 40px
            );
        }
    </style>
</head>
<body>

    <div class="header-text" id="status-text">NODE LOCKED // AWAITING INTERACTION</div>

    <div class="floor"></div>

    <div class="scene-wrapper">
        <div class="scene" id="scene">
            <div class="cube" id="cube">
                <!-- Front Face -->
                <div class="face front">
                    <div class="face-title">Uplink Status</div>
                    <div class="face-data">SECURE</div>
                </div>
                <!-- Back Face -->
                <div class="face back">
                    <div class="face-title">Node ID</div>
                    <div class="face-data">A-99</div>
                </div>
                <!-- Right Face -->
                <div class="face right">
                    <div class="face-title">Firewall</div>
                    <div class="face-data">ACTIVE</div>
                </div>
                <!-- Left Face -->
                <div class="face left">
                    <div class="face-title">Packet Loss</div>
                    <div class="face-data">0.0%</div>
                </div>
                <!-- Top Face -->
                <div class="face top">
                    <div class="face-title">Mem Dump</div>
                    <div class="hex-stream" id="hex-feed">
                        0xFA 0x1B<br>0x99 0x2C<br>0x4D 0xEF
                    </div>
                </div>
                <!-- Bottom Face -->
                <div class="face bottom">
                    <div class="face-title">Power</div>
                    <div class="face-data">100%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');
        const statusText = document.getElementById('status-text');
        const hexFeed = document.getElementById('hex-feed');
        
        let isUnlocked = false;
        let isUnlocking = false;

        // --- 3D Mouse Tracking Logic ---
        document.addEventListener('mousemove', (e) => {
            if (isUnlocking) return; // Freeze tracking while the unlock animation plays

            // Calculate mouse position relative to the center of the screen
            const xAxis = (window.innerWidth / 2 - e.pageX) / 10;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 10;
            
            // Apply the rotation to the scene (inverted for natural feel)
            // If the node is unlocked, we keep it spinning slowly on top of the mouse tracking
            if(isUnlocked) {
                scene.style.transform = `rotateY(${xAxis + Date.now()/20}deg) rotateX(${yAxis}deg)`;
            } else {
                scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        // Optional: Keep it spinning slightly when unlocked even without mouse movement
        setInterval(() => {
            if (isUnlocked && !isUnlocking) {
                const xAxis = (window.innerWidth / 2 - mousePos.x) / 10;
                const yAxis = (window.innerHeight / 2 - mousePos.y) / 10;
                scene.style.transform = `rotateY(${xAxis + Date.now()/30}deg) rotateX(${yAxis}deg)`;
            }
        }, 50);

        let mousePos = { x: window.innerWidth/2, y: window.innerHeight/2 };
        document.addEventListener('mousemove', (e) => {
            mousePos.x = e.pageX;
            mousePos.y = e.pageY;
        });

        // --- Click to Unlock Logic ---
        scene.addEventListener('click', () => {
            if (isUnlocked || isUnlocking) return;
            
            isUnlocking = true;
            statusText.textContent = "DECRYPTING TESSERACT CORE...";
            statusText.style.color = "var(--rose)";

            // Trigger the rapid spin CSS class
            cube.classList.add('unlocking');

            // Wait for the spin to finish, then unlock
            setTimeout(() => {
                cube.classList.remove('unlocking');
                cube.classList.add('unlocked');
                document.body.classList.add('unlocked');
                
                statusText.textContent = "ACCESS GRANTED // DATA EXTRACTED";
                statusText.style.color = "var(--gold)";
                
                // Reset scene transform to 0 momentarily before giving control back
                scene.style.transform = `rotateY(0deg) rotateX(0deg)`;
                
                setTimeout(() => {
                    isUnlocked = true;
                    isUnlocking = false;
                }, 100);

            }, 1500); // 1.5s matches the CSS transition time
        });

        // Simulate live hex data on the top face
        setInterval(() => {
            if(!isUnlocked) {
                const hex1 = Math.random().toString(16).substr(2, 2).toUpperCase();
                const hex2 = Math.random().toString(16).substr(2, 2).toUpperCase();
                const hex3 = Math.random().toString(16).substr(2, 2).toUpperCase();
                const hex4 = Math.random().toString(16).substr(2, 2).toUpperCase();
                const hex5 = Math.random().toString(16).substr(2, 2).toUpperCase();
                const hex6 = Math.random().toString(16).substr(2, 2).toUpperCase();
                hexFeed.innerHTML = `0x${hex1} 0x${hex2}<br>0x${hex3} 0x${hex4}<br>0x${hex5} 0x${hex6}`;
            } else {
                hexFeed.innerHTML = `DECRYPTED<br>PAYLOAD<br>READY`;
                hexFeed.style.color = "var(--gold)";
                hexFeed.style.fontSize = "0.75rem";
                hexFeed.style.fontWeight = "bold";
            }
        }, 500);
    </script>
</body>
</html>
