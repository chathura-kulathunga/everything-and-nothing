<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Entropy // Password</title>
    <style>
        :root {
            --bg-base: #070707;
            --surface: #111;
            --gold: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.2);
            --rose: #8b0000;
            --rose-dim: rgba(139, 0, 0, 0.3);
            --text-main: #eaeaea;
            --text-muted: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-base);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .auth-wrapper {
            background: var(--surface);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--gold-dim);
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .auth-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .input-group {
            position: relative;
            margin-bottom: 10px;
        }

        .input-label {
            display: block;
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .password-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 14px 45px 14px 15px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            border-color: var(--gold);
            box-shadow: inset 0 0 10px var(--gold-dim);
        }

        .toggle-visibility {
            position: absolute;
            right: 15px;
            top: 38px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .toggle-visibility:hover {
            color: var(--gold);
        }

        /* Entropy Meter */
        .entropy-container {
            margin-top: 15px;
        }

        .entropy-bar-bg {
            width: 100%;
            height: 4px;
            background: var(--bg-base);
            border: 1px solid #222;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .entropy-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--rose);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--rose-dim);
        }

        .feedback-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            min-height: 16px;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="input-group">
            <label class="input-label">Authorization Key</label>
            <input type="password" class="password-input" id="pwd-input" placeholder="Enter passphrase...">
            <button class="toggle-visibility" id="toggle-btn" tabindex="-1">SHOW</button>
        </div>

        <div class="entropy-container">
            <div class="entropy-bar-bg">
                <div class="entropy-bar-fill" id="entropy-bar"></div>
            </div>
            <div class="feedback-text" id="feedback-msg">Awaiting input...</div>
        </div>
    </div>

    <script>
        const pwdInput = document.getElementById('pwd-input');
        const toggleBtn = document.getElementById('toggle-btn');
        const entropyBar = document.getElementById('entropy-bar');
        const feedbackMsg = document.getElementById('feedback-msg');

        // Toggle Password Visibility
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'HIDE';
                toggleBtn.style.color = 'var(--rose)';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'SHOW';
                toggleBtn.style.color = 'var(--text-muted)';
            }
        });

        // Analyze Cognitive Predictability & Entropy
        pwdInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let score = 0;
            let feedback = "Awaiting input...";
            let color = "var(--rose)";
            let glow = "var(--rose-dim)";

            if (val.length > 0) {
                // Length check
                if (val.length > 5) score += 20;
                if (val.length > 10) score += 20;
                
                // Complexity checks
                if (/[A-Z]/.test(val)) score += 15;
                if (/[0-9]/.test(val)) score += 15;
                if (/[^A-Za-z0-9]/.test(val)) score += 20;
                
                // Behavioral predictability penalties (common patterns)
                if (/(123|abc|qwerty|password)/i.test(val)) {
                    score -= 30;
                }

                // Ensure score is within bounds
                score = Math.max(0, Math.min(score, 100));

                // Update UI based on psychological/entropy thresholds
                if (score < 30) {
                    feedback = "Cognitive predictability HIGH. Vulnerable.";
                    color = "var(--rose)";
                    glow = "rgba(139, 0, 0, 0.4)";
                } else if (score < 70) {
                    feedback = "Standard entropy. Susceptible to targeted brute-force.";
                    color = "#d4af37"; // Gold
                    glow = "rgba(212, 175, 55, 0.4)";
                } else {
                    feedback = "Cryptographically sound. Vault-grade complexity.";
                    color = "#00ff41"; // Terminal Green for absolute security
                    glow = "rgba(0, 255, 65, 0.4)";
                }
            } else {
                score = 0;
            }

            // Render updates
            entropyBar.style.width = score + '%';
            entropyBar.style.background = color;
            entropyBar.style.boxShadow = `0 0 10px ${glow}`;
            
            feedbackMsg.textContent = feedback;
            if (score > 0) {
                feedbackMsg.style.color = color;
            } else {
                feedbackMsg.style.color = 'var(--text-muted)';
            }
        });
    </script>
</body>
</html>
